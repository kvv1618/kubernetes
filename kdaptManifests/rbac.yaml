apiVersion: v1
kind: ServiceAccount
metadata:
  name: kdapt-scheduler
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kdapt-scheduler-role
rules:
  - apiGroups: [""]
    resources: ["pods","nodes","namespaces","configmaps","persistentvolumes","persistentvolumeclaims","replicationcontrollers","services"]
    verbs: ["get","list","watch"]
  - apiGroups: ["apps"]
    resources: ["deployments","statefulsets","replicasets"]
    verbs: ["get","list","watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get","list","watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes","csidrivers","volumeattachments","storageclasses","csistoragecapacities"]
    verbs: ["get","list","watch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceslices","deviceclasses","resourceclaims"]
    verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kdapt-scheduler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kdapt-scheduler-role
subjects:
- kind: ServiceAccount
  name: kdapt-scheduler
  namespace: kube-system
